name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  app:
    name: Type-check, lint, test, audit, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Throwaway values so the app's startup validation passes in CI. No
      # database is needed in Phase 0; the master key is generated per run.
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://jaded:jaded@127.0.0.1:5432/jaded_ci
      ENCRYPTION_ACTIVE_KEY_VERSION: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Generate a throwaway master key
        run: echo "ENCRYPTION_MASTER_KEYS=ci:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Startup refuses without required environment
        run: |
          if env -u DATABASE_URL timeout 60 npx next start -p 3200 > start.log 2>&1; then
            echo "next start ran without DATABASE_URL"; exit 1
          fi
          grep -q "DATABASE_URL is required" start.log
